[project]
name = "pact-coord"
version = "0.1.0"
description = "Python client for pact-coord, pact's MCP-based file-lease/messaging coordination server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/zekariasasaminew/pact"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pact_coord*"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
