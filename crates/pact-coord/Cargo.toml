[package]
name = "pact-coord"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Streamable HTTP mode with one route per lane (issue #329). Off by default
# so the Python/TS binding builds do not pull axum and hyper.
http = ["rmcp/transport-streamable-http-server", "dep:axum", "dep:tokio-util", "tokio/net"]

[dependencies]
anyhow.workspace = true
tracing.workspace = true
tokio.workspace = true
rmcp.workspace = true
rusqlite.workspace = true
globset.workspace = true
walkdir.workspace = true
dirs.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
axum = { version = "0.8", optional = true, default-features = false, features = ["http1", "tokio"] }
tokio-util = { version = "0.7", optional = true }

[dev-dependencies]
uuid.workspace = true
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
